services:

  # ════════════════════════════════════════════════════════════════════════════
  #  Base de données PostgreSQL
  # ════════════════════════════════════════════════════════════════════════════
  db:
    image: postgres:15-alpine
    container_name: smartrecruit_db
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-smartrecruit}
      POSTGRES_USER:     ${POSTGRES_USER:-smartrecruit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartrecruit_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartrecruit_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  #  Redis — broker Celery
  # ════════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: smartrecruit_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  #  Backend Django — API REST
  # ════════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartrecruit_backend
    restart: always
    env_file:
      - .env
    environment:
      - MEDIA_ROOT=/app/media
      - STATIC_ROOT=/app/static
    volumes:
      - media_files:/app/media
      - static_files:/app/static
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════════════
  #  Celery Worker — tâches IA asynchrones
  # ════════════════════════════════════════════════════════════════════════════
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartrecruit_celery
    restart: always
    env_file:
      - .env
    environment:
      - MEDIA_ROOT=/app/media
      - STATIC_ROOT=/app/static
    volumes:
      - media_files:/app/media
    entrypoint: ["/app/entrypoint-celery.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════════════
  #  Celery Beat — tâches périodiques
  # ════════════════════════════════════════════════════════════════════════════
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartrecruit_celery_beat
    restart: always
    env_file:
      - .env
    environment:
      - MEDIA_ROOT=/app/media
      - STATIC_ROOT=/app/static
    entrypoint: ["/app/entrypoint-beat.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════════════
  #  Frontend React
  # ════════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: smartrecruit_frontend
    restart: always
    expose:
      - "3000"

  # ════════════════════════════════════════════════════════════════════════════
  #  Nginx — reverse proxy
  # ════════════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.25-alpine
    container_name: smartrecruit_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - media_files:/app/media
      - static_files:/app/static
    depends_on:
      - backend
      - frontend

  # ════════════════════════════════════════════════════════════════════════════
  #  n8n — Orchestration de workflows
  # ════════════════════════════════════════════════════════════════════════════
  n8n:
    image: n8nio/n8n:latest
    container_name: smartrecruit_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-adminpass}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Africa/Tunis
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  media_files:
  static_files:
  n8n_data:
