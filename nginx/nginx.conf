# ── SmartRecruit AI — Nginx Reverse Proxy ───────────────────────────────────

# Résolution DNS dynamique Docker (important pour les redémarrages de conteneurs)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # ── API Backend ──────────────────────────────────────────────────────────
    location /api/ {
        set $backend "http://smartrecruit_backend:8000";
        proxy_pass         $backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── Admin Django ─────────────────────────────────────────────────────────
    location /admin/ {
        set $backend "http://smartrecruit_backend:8000";
        proxy_pass       $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Fichiers media ────────────────────────────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Fichiers statiques Django ─────────────────────────────────────────────
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend React (SPA) ─────────────────────────────────────────────────
    location / {
        set $frontend "http://smartrecruit_frontend:3000";
        proxy_pass         $frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
